name: Test Octo STS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-octo-sts:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to federate tokens.

    steps:
    - uses: octo-sts/action@210248e8ae1ae1550aa6e232c6f192b3ccbf7335
      id: octo-sts
      with:
        scope: homburg/build-repo
        identity: push

    - env:
        GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      id: list_repos
      run: |
        gh repo list | tee -a "$GITHUB_OUTPUT"
    
    - uses: actions/github-script@v7
      with:
        script: |
          const list_repos_output = ${{ toJSON(steps.list_repos.outputs.stdout) }}
          console.log(list_repos_output)

          core.summary
            .addRaw(`\n\`\`\`\n${list_repos_output}\n\`\`\`\n`)
            .write();
    
    - name: Debug OIDC Claims
      uses: github/actions-oidc-debugger@main
      with:
        audience: '${{ github.server_url }}/${{ github.repository_owner }}'