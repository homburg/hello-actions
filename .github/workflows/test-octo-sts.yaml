name: Test Octo STS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-octo-sts:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to federate tokens.

    steps:
    - uses: octo-sts/action@210248e8ae1ae1550aa6e232c6f192b3ccbf7335
      id: octo-sts
      with:
        scope: homburg/build-repo
        identity: push

    - uses: actions/github-script@v7
      with:
        script: |
          const list_repos_output = await exec.getExecOutput('gh', ["repo", "list"], {
            env: {
              GITHUB_TOKEN: ${{ toJSON(steps.octo-sts.outputs.token) }}
            },
          });

          core.summary
            .addRaw(`\n\`\`\`\n${list_repos_output}\n\`\`\`\n`)
            .write();
    
    - name: Debug OIDC Claims
      uses: github/actions-oidc-debugger@main
      with:
        audience: '${{ github.server_url }}/${{ github.repository_owner }}'